.avp{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;flex:0 0 auto;border:1px solid var(--bd);background:var(--hnb);color:var(--hn);overflow:hidden;transition:background .2s ease,color .2s ease}
.avp svg{width:54px;height:54px;fill:currentColor;display:block}

.avp.sm{width:56px;height:56px}.avp.sm svg{width:38px;height:38px}

.avrow{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.avrow .mu{font-size:12px;line-height:1.35}
.phid{display:flex;align-items:center;gap:12px;min-width:0}
.pcell{display:inline-flex;align-items:center;gap:6px}
.oim{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--pri2);color:var(--pri);border:1px solid var(--bd);flex:0 0 auto}
.oim svg{width:38px;height:38px;display:block}
.oim.sm{width:34px;height:34px;border-radius:8px}
.oim.sm svg{width:27px;height:27px}
.ocell{display:inline-flex;align-items:center;gap:10px;min-width:0;line-height:1.25}
.en-paciente .oim.sm{width:30px;height:30px}
.en-paciente .oim.sm svg{width:24px;height:24px}
.en-pacientes .pn{font-size:12px}
.mu{line-height:1.45}
h1,h2,h3{letter-spacing:-.01em}
.pg{padding:20px 28px 56px}
.empty{display:grid;place-items:center;text-align:center;padding:48px 16px;color:var(--sec)}
.empty .ic{width:44px;height:44px;opacity:.35;margin-bottom:12px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.sk{background:linear-gradient(90deg,var(--bg) 0%,var(--sf) 50%,var(--bg) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--rad-sm)}

const TK="orto_token";
const token=()=>localStorage.getItem(TK)||"";
async function api(ruta,cfg={}){
  const h={...(cfg.body?{"Content-Type":"application/json"}:{}),...(cfg.headers||{})};
  if(token())h.Authorization="Bearer "+token();
  const op={...cfg,headers:h};
  if(cfg.body&&typeof cfg.body!=="string")op.body=JSON.stringify(cfg.body);
  let r;
  try{r=await fetch(ruta,op)}catch(e){throw new Error("No hay conexión con el servidor")}
  if(r.status===401&&token()){localStorage.removeItem(TK);S.user=null;draw()}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=d&&(d.detail||d.message);throw new Error(Array.isArray(m)?m.map(x=>x.msg||x).join(", "):m||("Error "+r.status))}
  return d;
}

/* Carga todo lo que el rol puede leer y la sesión actual */
async function cargar(){
  const [todo,yo]=await Promise.all([api("/api/todo"),api("/api/yo")]);
  DB=VACIO();
  for(const k of Object.keys(TABLA))DB[k]=(todo[TABLA[k]]||[]).map(r=>fromK(k,r));
  const imgs={};(todo["_imagenes"]||[]).forEach(i=>{if(!imgs[i.estudio_id])imgs[i.estudio_id]=i.id});
  DB.I.forEach(x=>x.im=imgs[x.id]||null);
  S.user={u:yo.usuario,nombre:yo.nombre,rol:yo.rol};
  if(yo.es_admin){
    const[f,us,med]=await Promise.all([api("/api/funciones"),api("/api/usuarios"),api("/api/medicos")]);
    Object.entries(f.roles).forEach(([r,m])=>DB.PM[r]=m);
    DB.users=(us.usuarios||[]).map(x=>({id:x.id,u:x.usuario,nombre:x.nombre,rol:x.rol,on:x.activo,cp:x.debe_cambiar_clave}));
    DB.medicos=med.medicos||[];
  }else{
    DB.PM[yo.rol]=yo.modulos||[];
    const med=await api("/api/medicos").catch(()=>({medicos:[]}));
    DB.medicos=med.medicos||[];
    DB.users=DB.medicos.map(n=>({nombre:n,rol:"medico"}));
  }
}

async function entrar(usuario,password){
  const r=await api("/api/login",{method:"POST",body:{usuario,password}});

async function gp(){const v=i=>$("#"+i).value.trim(),er=m=>{$("#nr").textContent=m},n=v("nn"),fn=v("nf");

const mb=[...document.querySelectorAll(".mb")].filter(x=>x.checked).map(x=>x.value).concat(v("no")?[v("no")]:[]);
const rec={id:null,n,fn,e:edadDe(fn),sx:v("nx"),c:v("nc"),tl:v("nt"),em:v("nm"),s:v("ns"),na:v("na"),al:v("nl"),dx:v("ni"),am:mb.join(", "),aq:v("nq"),me:v("nu"),af:v("nh"),ha:`Tabaquismo: ${v("nb")} · Alcohol: ${v("nal")} · Actividad: ${v("nac")}`,st:0,ea:"Por agendar",eu:/Privado/i.test(v("ns"))?"No requiere":"Por solicitar",au:{n:"",ven:"",cob:0},hs:[]};
const dupByCode = rec.c?null: (rec.cd ? DB.P.find(x=>x.cd && x.cd===rec.cd) : null);
const dupByCed = rec.c ? DB.P.find(x=>x.c && x.c===rec.c) : null;
const dupByName = DB.P.filter(x=>x.n.toLowerCase()===rec.n.toLowerCase());
const dups = [];
if (dupByCode && !dups.includes(dupByCode)) dups.push(dupByCode);
if (dupByCed && !dups.includes(dupByCed)) dups.push(dupByCed);
dupByName.forEach(x=>{ if(!dups.includes(x)) dups.push(x) });
if (dups.length) {
  const dup=dups[0];
  const motivo = dupByCode ? "el mismo código" : (dupByCed ? "la misma cédula" : "el mismo nombre");
  const aviso = dupByName.length && !dupByCed && !dupByCode
    ? "Ya existe un paciente con ese nombre. ¿Es un paciente nuevo?"
    : "Ya existe un paciente registrado con "+motivo+".";
  const o=modal(`<h3>Paciente ya registrado</h3>
    <p>${aviso}</p>
    <p class="mu">Coincidencia: <b>${esc(dup.n)}</b> (código ${esc(dup.cd||"?")})${dup.c?" · cédula "+esc(dup.c):""}.</p>

  o.querySelector("#dup_cancel").onclick=()=>o.remove();
  o.querySelector("#dup_nuevo").onclick=async()=>{o.remove();try{const id=await crearK("P",rec);DB.P.push({...rec,id});S.ap=id;S.pa.p=id;go("p-"+id)}catch(e){er(e.message)}};
  o.querySelector("#dup_add").onclick=async()=>{o.remove();
    const campos=["n","e","c","s","al","dx","fn","sx","tl","em","na","am","aq","me","af","ha","ea","eu"];
    for(const k of campos){ if(rec[k]!==undefined && rec[k]!=="" && rec[k]!==null && (dup[k]===undefined || dup[k]==="" || dup[k]===null)){ dup[k]=rec[k] } }
    // also set codigo stays
    try{ await editarK("P",dup); const idx=DB.P.findIndex(x=>x.id==dup.id); if(idx>=0) DB.P[idx]=dup; S.ap=dup.id; S.pa.p=dup.id; toast("Información agregada al paciente existente"); go("p-"+dup.id) }catch(e){er(e.message)} };
  }
try{const id=await crearK("P",rec);DB.P.push({...rec,id});S.ap=id;S.pa.p=id;go("p-"+id)}catch(e){er(e.message)}}
