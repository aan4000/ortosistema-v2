const TK="orto_token";
const token=()=>localStorage.getItem(TK)||"";
async function api(ruta,cfg={}){
  const h={...(cfg.body?{"Content-Type":"application/json"}:{}),...(cfg.headers||{})};
  if(token())h.Authorization="Bearer "+token();
  const op={...cfg,headers:h};
  if(cfg.body&&typeof cfg.body!=="string")op.body=JSON.stringify(cfg.body);
  let r;
  try{r=await fetch(ruta,op)}catch(e){throw new Error("No hay conexión con el servidor")}
  if(r.status===401&&token()){localStorage.removeItem(TK);S.user=null;draw()}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=d&&(d.detail||d.message);throw new Error(Array.isArray(m)?m.map(x=>x.msg||x).join(", "):m||("Error "+r.status))}
  return d;
}

function miSeguridad(){
  const o=modal(`<div class="row"><h3 style="margin:0">${ic("shieldq",20)} Preguntas de seguridad</h3><button class="icb" data-tip="Cerrar" aria-label="Cerrar" id="sgx">${ic("x",18)}</button></div><div id="sgbox"><p class="mu">Cargando…</p></div>`);
  o.querySelector("#sgx").onclick=()=>o.remove();const box=o.querySelector("#sgbox");
  api("/api/seguridad").then(d=>{
    const act=d.preguntas||[],cat=[...new Set([...(d.catalogo||[]),...act.map(p=>p.pregunta)])];
    const opts=sel=>cat.map(q=>`<option${q==sel?" selected":""}>${esc(q)}</option>`).join("");
    box.innerHTML=`<p class="mu">Elige 3 preguntas y escribe una respuesta que recuerdes. Las respuestas se guardan cifradas y sirven para recuperar tu contraseña sin depender del administrador.</p>${[0,1,2].map(i=>`<div class="fg"><div><label>Pregunta ${i+1}<select data-sgq="${i}">${opts(act[i]&&act[i].pregunta)}</select></label></div><div><label>Respuesta ${i+1}<input data-sga="${i}" autocomplete="off" placeholder="Escribe tu respuesta"></label></div></div>`).join("")}<label>Contraseña actual (para confirmar)<input id="sgp" type="password" autocomplete="current-password"></label><div class="er2" id="sge" role="alert"></div><div class="tb"><button class="btn" id="sgc">${ic("x",16)} Cancelar</button><button class="btn p" id="sgs">${ic("shieldcheck",16)} Guardar preguntas</button></div>`;
    box.querySelector("#sgc").onclick=()=>o.remove();box.querySelector("#sgp").focus();
    box.querySelector("#sgs").onclick=async()=>{
      const preguntas=[...box.querySelectorAll("[data-sgq]")].map((s,i)=>({pregunta:s.value,respuesta:box.querySelector(`[data-sga="${i}"]`).value.trim()}));
      const actual=box.querySelector("#sgp").value,e=m=>{box.querySelector("#sge").textContent=m};
      if(preguntas.some(p=>!p.respuesta))return e("Responde las 3 preguntas.");
      if(new Set(preguntas.map(p=>p.pregunta)).size<3)return e("Elige 3 preguntas diferentes.");
      if(!actual)return e("Escribe tu contraseña actual.");
      const b=box.querySelector("#sgs");b.disabled=true;
      try{await api("/api/seguridad",{method:"PUT",body:{actual,preguntas}});if(S.user)S.user.preguntas=true;toast("Preguntas de seguridad guardadas");o.remove();
        if(S.route=="admin-seguridad")api("/api/admin/resumen").then(r=>{S.adm=r;draw()}).catch(()=>draw());
      }catch(ex){b.disabled=false;e(ex.message)}};
  }).catch(e=>{box.innerHTML=`<div class="er2">${esc(e.message)}</div>`});
}

async function gp(){const v=i=>$("#"+i).value.trim(),er=m=>{$("#nr").textContent=m},n=v("nn"),fn=v("nf");

if(!v("nx"))return er("Selecciona el sexo.");
const mb=[...document.querySelectorAll(".mb")].filter(x=>x.checked).map(x=>x.value).concat(v("no")?[v("no")]:[]);
const rec={id:null,n,fn,e:edadDe(fn),sx:v("nx"),c:v("nc"),tl:v("nt"),em:v("nm"),s:v("ns"),na:v("na"),al:v("nl"),dx:v("ni"),am:mb.join(", "),aq:v("nq"),me:v("nu"),af:v("nh"),ha:`Tabaquismo: ${v("nb")} · Alcohol: ${v("nal")} · Actividad: ${v("nac")}`,st:0,ea:"Por agendar",eu:/Privado/i.test(v("ns"))?"No requiere":"Por solicitar",au:{n:"",ven:"",cob:0},hs:[]};
const dupByCode = rec.c?null: (rec.cd ? DB.P.find(x=>x.cd && x.cd===rec.cd) : null);
const dupByCed = rec.c ? DB.P.find(x=>x.c && x.c===rec.c) : null;
const dupByName = DB.P.filter(x=>x.n.toLowerCase()===rec.n.toLowerCase());
const dups = [];
if (dupByCode && !dups.includes(dupByCode)) dups.push(dupByCode);
if (dupByCed && !dups.includes(dupByCed)) dups.push(dupByCed);
dupByName.forEach(x=>{ if(!dups.includes(x)) dups.push(x) });
if (dups.length) {
  const dup=dups[0];
  const motivo = dupByCode ? "el mismo código" : (dupByCed ? "la misma cédula" : "el mismo nombre");
  const aviso = dupByName.length && !dupByCed && !dupByCode
    ? "Ya existe un paciente con ese nombre. ¿Es un paciente nuevo?"
    : "Ya existe un paciente registrado con "+motivo+".";
  const o=modal(`<h3>Paciente ya registrado</h3>
    <p>${aviso}</p>
    <p class="mu">Coincidencia: <b>${esc(dup.n)}</b> (código ${esc(dup.cd||"?")})${dup.c?" · cédula "+esc(dup.c):""}.</p>

  o.querySelector("#dup_cancel").onclick=()=>o.remove();
  o.querySelector("#dup_nuevo").onclick=async()=>{o.remove();try{const id=await crearK("P",rec);DB.P.push({...rec,id});S.ap=id;S.pa.p=id;go("p-"+id)}catch(e){er(e.message)}};
  o.querySelector("#dup_add").onclick=async()=>{o.remove();
    const campos=["n","e","c","s","al","dx","fn","sx","tl","em","na","am","aq","me","af","ha","ea","eu"];
    for(const k of campos){ if(rec[k]!==undefined && rec[k]!=="" && rec[k]!==null && (dup[k]===undefined || dup[k]==="" || dup[k]===null)){ dup[k]=rec[k] } }
    // also set codigo stays
    try{ await editarK("P",dup); const idx=DB.P.findIndex(x=>x.id==dup.id); if(idx>=0) DB.P[idx]=dup; S.ap=dup.id; S.pa.p=dup.id; toast("Información agregada al paciente existente"); go("p-"+dup.id) }catch(e){er(e.message)} };
  }
try{const id=await crearK("P",rec);DB.P.push({...rec,id});S.ap=id;S.pa.p=id;go("p-"+id)}catch(e){er(e.message)}}

const formaDe=s=>{const m=String(s||"").match(/\(([^)]+)\)/);if(!m)return"";const f=m[1].toLowerCase();if(/tableta/.test(f))return"Tableta";if(/cápsula|capsula/.test(f))return"Cápsula";if(/inyectable|soluci[oó]n inyectable/.test(f))return"Inyectable";if(/jarabe/.test(f))return"Jarabe";if(/suspensi[oó]n/.test(f))return"Suspensión";if(/ungüento|unguento/.test(f))return"Ungüento";if(/gel/.test(f))return"Gel";if(/crema/.test(f))return"Crema";if(/soluci[oó]n/.test(f))return"Solución";if(/gotas/.test(f))return"Gotas";if(/supositorio/.test(f))return"Supositorio";if(/parche/.test(f))return"Parche";if(/pluma|vial|jeringa/.test(f))return"Inyectable";return""};

/* Calendario para elegir el día de la agenda */
function agCal(){
  const abierto=document.getElementById("agcal");if(abierto){abierto.remove();return}
  const wrap=document.getElementById("agwrap");if(!wrap)return;
  const base=new Date((S.ag||iso(hoy))+"T00:00:00"),hoyD=new Date();
  let y=base.getFullYear(),mes=base.getMonth();
  const pad=n=>String(n).padStart(2,"0"),clave=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const kHoy=clave(hoyD),kSel=S.ag||iso(hoy),cupo={};
  DB.Q.forEach(q=>{if(q.e!="Cancelada"){const k=d2f(q.f);cupo[k]=(cupo[k]||0)+1}});
  const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],DS=["L","M","M","J","V","S","D"];
  const el=document.createElement("div");
  el.id="agcal";el.className="calpop";el.setAttribute("role","dialog");el.setAttribute("aria-label","Calendario de la agenda");
  wrap.appendChild(el);
  const etq=(dt,n)=>`${n} de ${MESES[dt.getMonth()]} de ${dt.getFullYear()}`;
  const pinta=()=>{
    const ini=new Date(y,mes,1),desp=(ini.getDay()+6)%7,dias=new Date(y,mes+1,0).getDate(),prev=new Date(y,mes,0).getDate();
    let c="";
    for(let i=desp-1;i>=0;i--){const dt=new Date(y,mes-1,prev-i),k=clave(dt);c+=`<button type="button" class="cd out" data-d="${k}" aria-label="${etq(dt,dt.getDate())}">${dt.getDate()}</button>`}
    for(let n=1;n<=dias;n++){const dt=new Date(y,mes,n),k=clave(dt);
      c+=`<button type="button" class="cd${k==kHoy?" today":""}${k==kSel?" sel":""}" data-d="${k}" aria-label="${etq(dt,n)}${k==kHoy?" (hoy)":""}"${k==kSel?' aria-current="date"':""}>${n}${cupo[k]?'<i class="dot"></i>':""}</button>`}
    const fin=(desp+dias)%7,rest=fin?7-fin:0;
    for(let n=1;n<=rest;n++){const dt=new Date(y,mes+1,n),k=clave(dt);c+=`<button type="button" class="cd out" data-d="${k}" aria-label="${etq(dt,n)}">${n}</button>`}
    el.innerHTML=`<div class="ch"><button type="button" class="icb" data-m="-1" data-tip="Mes anterior" aria-label="Mes anterior">${ic("chevl",16)}</button><b>${MESES[mes]} ${y}</b><button type="button" class="icb" data-m="1" data-tip="Mes siguiente" aria-label="Mes siguiente">${ic("chevr",16)}</button></div><div class="cw">${DS.map(d=>`<span aria-hidden="true">${d}</span>`).join("")}</div><div class="cw">${c}</div><div class="cf"><button type="button" class="btn" data-m="hoy">${ic("calcheck",15)} Hoy</button><span class="mu">${cupo[kSel]?(cupo[kSel]+" cita"+(cupo[kSel]>1?"s":"")+" ese día"):""}</span></div>`;
  };
  pinta();
  el.onclick=e=>{
    const mb=e.target.closest("[data-m]"),db=e.target.closest("[data-d]");
    if(mb){const m=mb.dataset.m;if(m=="hoy"){y=hoyD.getFullYear();mes=hoyD.getMonth()}else{const d=new Date(y,mes+(+m),1);y=d.getFullYear();mes=d.getMonth()}pinta();return}
    if(db&&db.dataset.d){cerrar();S.ag=db.dataset.d;draw()}
  };
  const cerrar=()=>{el.remove();document.removeEventListener("pointerdown",fuera,true);document.removeEventListener("keydown",tecla,true)};
  const fuera=e=>{if(!el.contains(e.target)&&!e.target.closest('[data-a="agcal"]'))cerrar()};
  const tecla=e=>{if(e.key=="Escape"){e.stopPropagation();cerrar()}};
  setTimeout(()=>{document.addEventListener("pointerdown",fuera,true);document.addEventListener("keydown",tecla,true)},0);
}

b.onclick=()=>{const s=i.type=="password";i.type=s?"text":"password";b.innerHTML=ic(s?"eyeoff":"eye",18);b.setAttribute("aria-label",s?"Ocultar contraseña":"Mostrar contraseña")};w.appendChild(b)})}
if(typeof MutationObserver!="undefined")new MutationObserver(()=>{eyes(document.body);iconize(document.body)}).observe(document.body,{childList:true,subtree:true});
boot();
</script>
</body>
