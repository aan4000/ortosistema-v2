services:
  - type: web
    name: ortosistema-v2
    runtime: python
    plan: free
    # Ohio (us-east-2): misma región que la base de datos en Neon.
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: AUTO_SCHEMA
        value: "1"
      - key: JWT_HORAS
        value: "8"
      # Se configuran al crear el servicio en Render; no van en el repositorio.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
